<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="beachSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B0E1E"/>
      <stop offset="40%" stop-color="#6E233D"/>
      <stop offset="70%" stop-color="#D97A85"/>
      <stop offset="100%" stop-color="#FCD5CE"/>
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A1828"/>
      <stop offset="100%" stop-color="#1F0710"/>
    </linearGradient>
  </defs>
  <rect width="800" height="650" fill="url(#beachSky)"/>
  
  <!-- Glowing sun reflection -->
  <circle cx="400" cy="500" r="110" fill="#FFF3D6" opacity="0.9"/>
  <rect y="650" width="800" height="350" fill="url(#oceanGrad)"/>
  
  <!-- Water light path -->
  <polygon points="400,650 340,1000 460,1000" fill="#FCD5CE" opacity="0.35"/>
  <ellipse cx="400" cy="680" rx="90" ry="10" fill="#FFF3D6" opacity="0.5"/>
  <ellipse cx="400" cy="720" rx="140" ry="14" fill="#FFF3D6" opacity="0.4"/>
  <ellipse cx="400" cy="770" rx="190" ry="16" fill="#FFF3D6" opacity="0.3"/>

  <!-- Lovers walking on shore holding hands -->
  <g fill="#1F0710" transform="translate(360, 610) scale(0.95)">
    <!-- Person 1 -->
    <circle cx="20" cy="15" r="14"/>
    <path d="M8,30 C8,22 32,22 32,30 L36,95 L14,95 Z"/>
    <!-- Person 2 -->
    <circle cx="65" cy="18" r="13"/>
    <path d="M52,32 C52,24 78,24 78,32 L82,95 L58,95 Z"/>
    <!-- Held hands -->
    <path d="M30,50 Q45,65 58,50" stroke="#1F0710" stroke-width="6" fill="none"/>
  </g>

  <text x="400" y="880" font-family="'Playfair Display', Georgia, serif" font-size="30" font-style="italic" fill="#FDFBF7" text-anchor="middle">
    « Main dans la main, vers l'infini »
  </text>
  <text x="400" y="920" font-family="'Montserrat', sans-serif" font-size="14" fill="#E8A598" text-anchor="middle" letter-spacing="4">
    NOTRE BALADE AU CRÉPUSCULE
  </text>
</svg>
