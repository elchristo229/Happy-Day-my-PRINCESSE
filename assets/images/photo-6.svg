<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="portraitGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#801D38"/>
      <stop offset="60%" stop-color="#3D0C1A"/>
      <stop offset="100%" stop-color="#1A040A"/>
    </radialGradient>
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#portraitGlow)"/>

  <!-- Ornate Golden Mirror/Frame -->
  <ellipse cx="400" cy="450" rx="260" ry="320" fill="none" stroke="url(#goldBorderGrad)" stroke-width="8"/>
  <ellipse cx="400" cy="450" rx="240" ry="300" fill="#2E0A15" stroke="#D4AF37" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- Crown / Tiara icon for Her Majesty -->
  <g transform="translate(400, 240) scale(1.3)" fill="#D4AF37">
    <path d="M-40,20 L-30,-20 L-10,0 L0,-35 L10,0 L30,-20 L40,20 Z"/>
    <circle cx="-30" cy="-24" r="4" fill="#FFF"/>
    <circle cx="0" cy="-39" r="5" fill="#FFF"/>
    <circle cx="30" cy="-24" r="4" fill="#FFF"/>
  </g>

  <!-- Radiant heart center -->
  <path d="M400,420 C360,360 280,380 280,450 C280,520 400,610 400,610 C400,610 520,520 520,450 C520,380 440,360 400,420 Z" 
        fill="#A8284B" stroke="#F3E5AB" stroke-width="4"/>

  <text x="400" y="525" font-family="'Great Vibes', cursive, serif" font-size="64" fill="#FFFDF7" text-anchor="middle">
    Ma Reine
  </text>

  <text x="400" y="850" font-family="'Playfair Display', Georgia, serif" font-size="32" font-style="italic" fill="#FDFBF7" text-anchor="middle">
    « La plus belle femme de l'univers »
  </text>
  <text x="400" y="895" font-family="'Montserrat', sans-serif" font-size="14" fill="#D4AF37" text-anchor="middle" letter-spacing="4">
    CÉLÉBRATION DE TA BEAUTÉ & TA GRÂCE
  </text>
</svg>
