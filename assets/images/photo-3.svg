<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGlow3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E1F"/>
      <stop offset="50%" stop-color="#801D38"/>
      <stop offset="100%" stop-color="#C25975"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="1"/>
      <stop offset="40%" stop-color="#F3E5AB" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#roseGlow3)"/>

  <!-- Golden interlocking rings / hearts symbol -->
  <circle cx="400" cy="480" r="160" fill="url(#ringGlow)"/>

  <g transform="translate(400, 480)" fill="none" stroke="#D4AF37" stroke-width="8" stroke-linecap="round">
    <!-- Heart 1 -->
    <path d="M-30,-20 C-60,-70 -120,-50 -120,10 C-120,70 -30,120 -30,120 C-30,120 60,70 60,10 C60,-50 0,-70 -30,-20 Z" stroke-opacity="0.85"/>
    <!-- Heart 2 interlocked -->
    <path d="M30,-40 C0,-90 -60,-70 -60,-10 C-60,50 30,100 30,100 C30,100 120,50 120,-10 C120,-70 60,-90 30,-40 Z" stroke="#FFF5E4" stroke-width="7" stroke-opacity="0.95"/>
  </g>

  <!-- Golden sparkles around -->
  <g fill="#FDFBF7">
    <path d="M250,280 Q260,280 260,270 Q260,280 270,280 Q260,280 260,290 Q260,280 250,280 Z"/>
    <path d="M540,320 Q550,320 550,310 Q550,320 560,320 Q550,320 550,330 Q550,320 540,320 Z"/>
    <path d="M280,650 Q290,650 290,640 Q290,650 300,650 Q290,650 290,660 Q290,650 280,650 Z"/>
    <path d="M520,640 Q530,640 530,630 Q530,640 540,640 Q530,640 530,650 Q530,640 520,640 Z"/>
  </g>

  <text x="400" y="800" font-family="'Playfair Display', Georgia, serif" font-size="32" font-style="italic" fill="#FDFBF7" text-anchor="middle">
    « Deux cœurs, une seule mélodie »
  </text>
  <text x="400" y="845" font-family="'Montserrat', sans-serif" font-size="14" fill="#F3E5AB" text-anchor="middle" letter-spacing="4">
    COMPLICITÉ & AMOUR INFINI
  </text>
</svg>
