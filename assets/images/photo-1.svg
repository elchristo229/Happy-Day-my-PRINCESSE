<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D0C1A"/>
      <stop offset="30%" stop-color="#5C1D2E"/>
      <stop offset="60%" stop-color="#8B263E"/>
      <stop offset="85%" stop-color="#E8A598"/>
      <stop offset="100%" stop-color="#FDFBF7"/>
    </linearGradient>
    <radialGradient id="sunGlow1" cx="50%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#FFF5E4" stop-opacity="1"/>
      <stop offset="35%" stop-color="#F3E5AB" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background sky -->
  <rect width="800" height="1000" fill="url(#skyGrad1)"/>
  
  <!-- Glowing sun/moon -->
  <circle cx="400" cy="620" r="140" fill="url(#sunGlow1)" filter="url(#softGlow1)"/>
  
  <!-- Delicate mountains in distance -->
  <path d="M0,720 Q200,640 400,690 T800,660 L800,1000 L0,1000 Z" fill="#4A1322" opacity="0.6"/>
  <path d="M0,780 Q250,710 500,770 T800,740 L800,1000 L0,1000 Z" fill="#2E0813" opacity="0.85"/>
  <path d="M0,840 Q180,800 400,820 T800,810 L800,1000 L0,1000 Z" fill="#1A040A"/>
  
  <!-- Silhouette of lovers under the stars -->
  <g fill="#1A040A" transform="translate(350, 710) scale(0.9)">
    <!-- He -->
    <circle cx="20" cy="20" r="16"/>
    <path d="M5,40 C5,30 35,30 35,40 L38,100 L2,100 Z"/>
    <!-- She leaning on him -->
    <circle cx="55" cy="24" r="15"/>
    <path d="M40,43 C40,32 72,32 72,43 L76,100 L34,100 Z"/>
    <path d="M30,55 Q50,70 60,65" stroke="#D4AF37" stroke-width="2" fill="none" opacity="0.4"/>
  </g>

  <!-- Stars -->
  <g fill="#FFF8E7" opacity="0.8">
    <circle cx="120" cy="150" r="2"/>
    <circle cx="280" cy="90" r="1.5"/>
    <circle cx="650" cy="180" r="2.5"/>
    <circle cx="520" cy="110" r="1.5"/>
    <circle cx="190" cy="320" r="2"/>
    <circle cx="700" cy="350" r="1.8"/>
    <circle cx="380" cy="220" r="3" filter="url(#softGlow1)"/>
    <circle cx="600" cy="80" r="2"/>
  </g>

  <!-- Golden heart constellation -->
  <path d="M400,280 C360,220 280,240 280,310 C280,380 400,470 400,470 C400,470 520,380 520,310 C520,240 440,220 400,280 Z" 
        fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="4,6" opacity="0.5"/>

  <!-- Romantic caption overlay -->
  <text x="400" y="930" font-family="'Playfair Display', Georgia, serif" font-size="28" font-style="italic" fill="#FDFBF7" text-anchor="middle" letter-spacing="2">
    « Ton sourire illumine mon monde »
  </text>
  <text x="400" y="965" font-family="'Montserrat', sans-serif" font-size="14" fill="#E8A598" text-anchor="middle" letter-spacing="4">
    PHOTO PRÉCIEUSE • SOUVENIR D'AMOUR
  </text>
</svg>
